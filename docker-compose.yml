version: '3'
# noinspection ComposeUnknownKeys
name: lemp
services:
  mariadb:
    image: db-app
    hostname: database
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: '123456'
    networks:
      development:
        ipv4_address: 100.100.10.3
    volumes:
      - 'database:/var/lib/mysql'
  nginx:
    image: nginx-app
    hostname: webserver
    restart: always
    networks:
      development:
        ipv4_address: 100.100.10.2
    env_file: [.env]
    volumes:
      - 'nginx:/etc/nginx/vhosts'
      - "${MKCERT_ROOT}:/etc/nginx/ssl"
      - 'php-fpm:/var/opt/remi/php81/run/php-fpm'
      - 'php82-fpm:/var/opt/remi/php82/run/php-fpm'
      - 'php84-fpm:/var/opt/remi/php84/run/php-fpm'
      - "${PROJECTS_ROOT}:/home/projects"
  php:
    image: php-app
    hostname: app
    restart: always
    environment:
      PROJECTS_ROOT: "${PROJECTS_ROOT}"
    networks:
      development:
        ipv4_address: 100.100.10.4
    volumes:
      - 'php-fpm:/var/opt/remi/php81/run/php-fpm'
      - "${PROJECTS_ROOT}:/home/projects"
  php82:
    image: php82-app
    hostname: app82
    restart: always
    environment:
      PROJECTS_ROOT: "${PROJECTS_ROOT}"
    networks:
      development:
        ipv4_address: 100.100.10.7
    volumes:
      - 'php82-fpm:/var/opt/remi/php82/run/php-fpm'
      - "${PROJECTS_ROOT}:/home/projects"
  php84:
    image: php84-app
    hostname: app84
    restart: always
    environment:
      PROJECTS_ROOT: "${PROJECTS_ROOT}"
    networks:
      development:
        ipv4_address: 100.100.10.8
    volumes:
      - 'php84-fpm:/var/opt/remi/php84/run/php-fpm'
      - "${PROJECTS_ROOT}:/home/projects"
  postgres:
    image: postgres:17
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: 'root'
      POSTGRES_PASSWORD: '123456'
    networks:
      development:
        ipv4_address: 100.100.10.9
    volumes:
      - 'postgres:/var/lib/postgresql/data'
  phpmyadmin:
    image: phpmyadmin
    hostname: db-admin
    restart: always
    environment:
      PMA_HOST: mariadb
      UPLOAD_LIMIT: 2G
    networks:
      development:
        ipv4_address: 100.100.10.5
  dns:
    image: dns-app
    hostname: dns-admin;
    restart: always
    env_file: [.env]
    tty: true
    stdin_open: true
    networks:
      development:
        ipv4_address: 100.100.10.6
    volumes:
      - "${MKCERT_ROOT}:/root/.local/share/mkcert"
      - '/etc/hosts:/etc/host.hosts'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - "${PROJECTS_ROOT}/lemp:/home/projects/lemp"
  orca:
    image: orca-app
    container_name: lemp-orca
    hostname: ai
    restart: always
    init: true
    shm_size: 256m
    environment:
      ORCA_PAIRING_ADDRESS: wss://ai.example.net
      ORCA_MOBILE_PAIRING: ${ORCA_MOBILE_PAIRING:-0}
    networks:
      development:
        ipv4_address: 100.100.10.8
    volumes:
    - orca-home:/home/nginx
    - ./orca-info:/var/lib/orca-info
    - ${PROJECTS_ROOT}:/home/projects
    - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - '127.0.0.1:6768:6768'
networks:
  development:
    ipam:
      config:
        - subnet: '100.100.10.0/24'

volumes:
  nginx: null
  database: null
  postgres: null
  php-fpm: null
  php82-fpm: null
  php84-fpm: null
  orca-home: null
