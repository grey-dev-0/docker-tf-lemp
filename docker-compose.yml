version: '3'
# noinspection ComposeUnknownKeys
name: lemp
services:
  mariadb:
    image: db-app
    hostname: database
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: '123456'
    networks:
      development:
        ipv4_address: 100.100.10.3
    volumes:
      - 'database:/var/lib/mysql'
  nginx:
    image: nginx-app
    hostname: webserver
    restart: always
    networks:
      development:
        ipv4_address: 100.100.10.2
    env_file: [.env]
    volumes:
      - 'nginx:/etc/nginx/vhosts'
      - "${MKCERT_ROOT}:/etc/nginx/ssl"
      - 'php-fpm:/var/opt/remi/php81/run/php-fpm'
      - 'php82-fpm:/var/opt/remi/php82/run/php-fpm'
      - "${PROJECTS_ROOT}:/home/projects"
  php:
    image: php-app
    hostname: app
    restart: always
    environment:
      PROJECTS_ROOT: "${PROJECTS_ROOT}"
    networks:
      development:
        ipv4_address: 100.100.10.4
    volumes:
      - 'php-fpm:/var/opt/remi/php81/run/php-fpm'
      - "${PROJECTS_ROOT}:/home/projects"
  php82:
    image: php82-app
    hostname: app82
    restart: always
    environment:
      PROJECTS_ROOT: "${PROJECTS_ROOT}"
    networks:
      development:
        ipv4_address: 100.100.10.7
    volumes:
      - 'php82-fpm:/var/opt/remi/php82/run/php-fpm'
      - "${PROJECTS_ROOT}:/home/projects"
  phpmyadmin:
    image: phpmyadmin
    hostname: db-admin
    restart: always
    environment:
      PMA_HOST: mariadb
      UPLOAD_LIMIT: 2G
    networks:
      development:
        ipv4_address: 100.100.10.5
  dns:
    image: dns-app
    hostname: dns-admin;
    restart: always
    env_file: [.env]
    tty: true
    stdin_open: true
    networks:
      development:
        ipv4_address: 100.100.10.6
    volumes:
      - "${MKCERT_ROOT}:/root/.local/share/mkcert"
      - '/etc/hosts:/etc/host.hosts'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - "${PROJECTS_ROOT}/lemp:/home/projects/lemp"

networks:
  development:
    ipam:
      config:
        - subnet: '100.100.10.0/24'

volumes:
  nginx:
  database:
  php-fpm:
  php82-fpm: